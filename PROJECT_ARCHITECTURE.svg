<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur NadiKota</title>
  <desc id="desc">Diagram arsitektur client web menuju Laravel API, PostgreSQL PostGIS, Redis dan worker, AI validator, penyimpanan, email dan layanan peta.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#eaf1f7"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12345b"/><stop offset="1" stop-color="#1d4f7a"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f70"/><stop offset="1" stop-color="#0f9f8c"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b45309"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0b1f3a" flood-opacity=".12"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#54718f"/></marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0f9f8c"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d97706"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .title{font-size:31px;font-weight:800;fill:#102b49;letter-spacing:-.4px}.sub{font-size:15px;font-weight:500;fill:#60748a}
      .zone{font-size:15px;font-weight:800;fill:#18385e;letter-spacing:.5px}.heading{font-size:16px;font-weight:800;fill:#fff}.body{font-size:13px;font-weight:500;fill:#fff;opacity:.94}
      .darkhead{font-size:15px;font-weight:800;fill:#18385e}.darkbody{font-size:12px;font-weight:500;fill:#50657a}.tag{font-size:11px;font-weight:700;fill:#fff;letter-spacing:.35px}.legend{font-size:12px;font-weight:600;fill:#243b53}
      .line{fill:none;stroke:#54718f;stroke-width:2.5;marker-end:url(#arr)}.dashed{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1440" height="980" rx="28" fill="url(#canvas)"/>
  <circle cx="1350" cy="90" r="150" fill="#0f9f8c" opacity=".04"/><circle cx="70" cy="870" r="160" fill="#1d4f7a" opacity=".04"/>
  <text x="64" y="62" class="title">Arsitektur Sistem NadiKota</text>
  <text x="64" y="91" class="sub">Pemisahan client, API/domain, data, worker, dan integrasi eksternal · diringkas dari source dan konfigurasi repositori</text>

  <!-- client zone -->
  <rect x="54" y="122" width="1332" height="204" rx="22" fill="#eaf0f7" stroke="#c7d4e2" stroke-width="2"/>
  <text x="82" y="154" class="zone">CLIENT APPLICATIONS</text>
  <g filter="url(#shadow)">
    <rect x="100" y="176" width="560" height="116" rx="17" fill="url(#blue)"/>
    <text x="380" y="207" text-anchor="middle" class="heading">Web · Next.js + React + TypeScript</text>
    <text x="380" y="235" text-anchor="middle" class="body"><tspan x="380">App Router · UI warga dan staf</tspan><tspan x="380" dy="19">peta, laporan, tiket, dispatch, hadiah</tspan></text>
    <rect x="780" y="176" width="560" height="116" rx="17" fill="#587caf"/>
    <text x="1060" y="207" text-anchor="middle" class="heading">Aktor pengguna</text>
    <text x="1060" y="235" text-anchor="middle" class="body"><tspan x="1060">Warga · Admin</tspan><tspan x="1060" dy="19">Tim Lapangan</tspan></text>
  </g>

  <!-- API zone -->
  <rect x="54" y="372" width="1332" height="286" rx="22" fill="#eaf0f7" stroke="#c7d4e2" stroke-width="2"/>
  <text x="82" y="405" class="zone">APPLICATION / API · Laravel 11 · PHP 8.2+</text>
  <text x="1358" y="405" text-anchor="end" class="sub">REST JSON · /api/v1 · Sanctum session · role middleware</text>
  <g filter="url(#shadow)">
    <rect x="82" y="430" width="218" height="182" rx="17" fill="#587caf"/>
    <text x="191" y="466" text-anchor="middle" class="heading">Identity &amp; Access</text>
    <text x="191" y="493" text-anchor="middle" class="body"><tspan x="191">Login · OTP · profil</tspan><tspan x="191" dy="19">policy dan role guard</tspan></text>
    <rect x="322" y="430" width="218" height="182" rx="17" fill="#587caf"/>
    <text x="431" y="466" text-anchor="middle" class="heading">Reports &amp; Photos</text>
    <text x="431" y="493" text-anchor="middle" class="body"><tspan x="431">Validasi request · privasi</tspan><tspan x="431" dy="19">idempotensi · clustering</tspan></text>
    <rect x="562" y="430" width="316" height="182" rx="17" fill="url(#blue)"/>
    <text x="720" y="466" text-anchor="middle" class="heading">Tickets &amp; Priority</text>
    <text x="720" y="493" text-anchor="middle" class="body"><tspan x="720">Status lifecycle · PostGIS clustering</tspan><tspan x="720" dy="19">Priority Engine deterministik</tspan><tspan x="720" dy="19">review manusia · SLA · dispatch</tspan></text>
    <rect x="900" y="430" width="218" height="182" rx="17" fill="#587caf"/>
    <text x="1009" y="466" text-anchor="middle" class="heading">Teams &amp; Rewards</text>
    <text x="1009" y="493" text-anchor="middle" class="body"><tspan x="1009">Tugas dan bukti lapangan</tspan><tspan x="1009" dy="19">poin dan penukaran</tspan></text>
    <rect x="1140" y="430" width="218" height="182" rx="17" fill="#587caf"/>
    <text x="1249" y="466" text-anchor="middle" class="heading">Notifications &amp; Analytics</text>
    <text x="1249" y="493" text-anchor="middle" class="body"><tspan x="1249">Notifikasi in-app</tspan><tspan x="1249" dy="19">ringkasan dan audit</tspan></text>
  </g>
  <rect x="568" y="621" width="304" height="25" rx="12.5" fill="#fff0d9" stroke="#efc281"/>
  <text x="720" y="638" text-anchor="middle" font-size="11" font-weight="700" fill="#92500a">Human-in-the-loop: admin memutuskan review</text>

  <!-- connections client-api -->
  <path d="M380 292V354" class="line"/>
  <rect x="474" y="332" width="492" height="26" rx="13" fill="#f5f8fc" stroke="#c7d4e2"/>
  <text x="720" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#34516f">HTTPS · REST API (JSON)</text>
  <path d="M380 358V372" class="line"/>

  <!-- external/data zone -->
  <text x="64" y="704" class="zone">DATA, ASYNC PROCESSING &amp; EXTERNAL SERVICES</text>
  <g filter="url(#shadow)">
    <rect x="64" y="732" width="290" height="150" rx="18" fill="#fff" stroke="#1d4f7a" stroke-width="2"/>
    <text x="209" y="769" text-anchor="middle" class="darkhead">PostgreSQL + PostGIS</text>
    <text x="209" y="798" text-anchor="middle" class="darkbody"><tspan x="209">users · reports · tickets · teams</tspan><tspan x="209" dy="18">geo · priority snapshots · points</tspan></text>
    <rect x="386" y="732" width="260" height="150" rx="18" fill="url(#blue)"/>
    <text x="516" y="769" text-anchor="middle" class="heading">Redis</text>
    <text x="516" y="798" text-anchor="middle" class="body"><tspan x="516">Queue · cache</tspan><tspan x="516" dy="18">queue worker terpisah</tspan></text>
    <rect x="678" y="732" width="340" height="150" rx="18" fill="url(#teal)"/>
    <text x="848" y="769" text-anchor="middle" class="heading">Image Validation</text>
    <text x="848" y="798" text-anchor="middle" class="body"><tspan x="848">Detektor lokal + OpenAI-compatible API</tspan><tspan x="848" dy="18">Hasil validasi gambar via queue</tspan></text>
    <rect x="1050" y="732" width="326" height="150" rx="18" fill="#fff" stroke="#587caf" stroke-width="2"/>
    <text x="1213" y="769" text-anchor="middle" class="darkhead">Integrasi layanan</text>
    <text x="1213" y="798" text-anchor="middle" class="darkbody"><tspan x="1213">SMTP · storage filesystem/S3</tspan><tspan x="1213" dy="18">tile/geocoding/routing eksternal</tspan></text>
  </g>

  <!-- backend to stores/workers -->
  <path d="M191 612V714" class="line"/>
  <path d="M431 612V692H516V714" class="line"/>
  <path d="M720 612V714" class="line"/>
  <path d="M1009 612V692H1213V714" class="line"/>
  <path d="M1249 612V714" class="line"/>
  <path d="M646 807H666" class="line"/>
  <path d="M1018 807H1038" class="line"/>

  <!-- scheduler -->
  <rect x="64" y="910" width="1312" height="42" rx="14" fill="#e2eaf3" stroke="#c7d4e2"/>
  <text x="720" y="936" text-anchor="middle" font-size="12" font-weight="700" fill="#34516f">Laravel Scheduler (cron): recompute priority harian + eskalasi SLA · Queue worker: AI validation dan notifikasi · keduanya perlu proses aktif</text>
  <path d="M720 910V891" fill="none" stroke="#54718f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>

  <!-- legend -->
</svg>
