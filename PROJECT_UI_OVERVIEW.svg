<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Peta layar web NadiKota</title>
  <desc id="desc">Sketsa layar web responsif warga dan dashboard staf/admin, berdasarkan implementasi project; bukan aplikasi native.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#eaf1f7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12345b"/><stop offset="1" stop-color="#1d4f7a"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f70"/><stop offset="1" stop-color="#0f9f8c"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c2410c"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102b49" flood-opacity=".12"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:30px;font-weight:800;fill:#102b49}.sub{font-size:14px;font-weight:500;fill:#60748a}.section{font-size:16px;font-weight:800;fill:#18385e;letter-spacing:.4px}.ui{font-size:8px;font-weight:600;fill:#243b53}.tiny{font-size:7px;font-weight:500;fill:#60748a}.white{fill:#fff}.label{font-size:11px;font-weight:700;fill:#24415f}.note{font-size:11px;font-weight:500;fill:#64788e}
    </style>
  </defs>
  <rect width="1440" height="1000" rx="28" fill="url(#bg)"/><circle cx="1370" cy="75" r="130" fill="#0f9f8c" opacity=".045"/>
  <text x="56" y="54" class="title">Layar Utama NadiKota</text>
  <text x="56" y="80" class="sub">Ringkasan UI aktual · warga memakai web responsif, bukan aplikasi native</text>
  <text x="56" y="122" class="section">A. Warga · web responsif</text>
  <g filter="url(#shadow)">
    <!-- Peta -->
    <rect x="58" y="145" width="300" height="325" rx="22" fill="#fff" stroke="#d5deea" stroke-width="3"/>
    <rect x="66" y="153" width="284" height="34" rx="12" fill="#15385f"/><text x="82" y="175" font-size="10" font-weight="800" class="white">NadiKota</text><circle cx="330" cy="170" r="6" fill="#0f9f8c"/>
    <rect x="67" y="188" width="282" height="230" fill="#dce7ef"/><path d="M70 236 345 278M70 294 345 326M120 190 147 418M271 190 255 418M70 365 345 350" stroke="#bdcddd" stroke-width="7"/>
    <circle cx="141" cy="283" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/><circle cx="274" cy="248" r="7" fill="#15966c" stroke="#fff" stroke-width="2"/><circle cx="219" cy="354" r="7" fill="#d97706" stroke="#fff" stroke-width="2"/>
    <rect x="84" y="201" width="247" height="25" rx="8" fill="#fff"/><text x="96" y="217" class="tiny">Cari tempat, jalan, gedung</text>
    <rect x="84" y="376" width="247" height="31" rx="10" fill="url(#orange)"/><text x="207" y="396" text-anchor="middle" font-size="9" font-weight="800" class="white">Lapor Kerusakan</text>
    <rect x="67" y="418" width="282" height="42" fill="#fff"/><text x="112" y="443" class="tiny">Peta</text><text x="202" y="443" class="tiny">Kontribusi</text><text x="291" y="443" class="tiny">Akun</text>
    <text x="208" y="492" text-anchor="middle" class="label">1 · Peta dan pencarian</text>

    <!-- Form laporan -->
    <rect x="398" y="145" width="300" height="325" rx="22" fill="#fff" stroke="#d5deea" stroke-width="3"/>
    <rect x="406" y="153" width="284" height="34" rx="12" fill="#15385f"/><text x="422" y="175" font-size="10" font-weight="800" class="white">Buat laporan</text>
    <text x="422" y="207" class="ui">Langkah 1 dari 3 · Foto kerusakan</text>
    <rect x="424" y="221" width="248" height="153" rx="12" fill="#202b3b"/><rect x="445" y="238" width="206" height="119" rx="5" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="548" cy="391" r="17" fill="#ea580c" stroke="#fff" stroke-width="4"/>
    <text x="548" y="418" text-anchor="middle" class="tiny">Screening foto dapat memakai AI</text><rect x="424" y="434" width="248" height="22" rx="7" fill="#e8eef4"/><text x="548" y="449" text-anchor="middle" class="tiny">Langkah berikutnya: lokasi dan detail</text>
    <text x="548" y="492" text-anchor="middle" class="label">2 · Form bertahap dan foto</text>

    <!-- Detail tiket -->
    <rect x="738" y="145" width="300" height="325" rx="22" fill="#fff" stroke="#d5deea" stroke-width="3"/>
    <rect x="746" y="153" width="284" height="34" rx="12" fill="#15385f"/><text x="762" y="175" font-size="10" font-weight="800" class="white">Detail laporan</text>
    <text x="764" y="208" class="ui">Jalan berlubang · tiket</text><path d="M780 233V348" stroke="#b8c9d9" stroke-width="3"/>
    <g fill="#0f9f8c"><circle cx="780" cy="236" r="7"/><circle cx="780" cy="270" r="7"/><circle cx="780" cy="304" r="7"/></g><circle cx="780" cy="338" r="7" fill="#fff" stroke="#bdcddd" stroke-width="2"/>
    <text x="799" y="240" class="tiny">Dilaporkan</text><text x="799" y="274" class="tiny">Dalam tinjauan</text><text x="799" y="308" class="tiny">Dalam antrean / proses</text><text x="799" y="342" class="tiny">Selesai</text>
    <rect x="764" y="367" width="252" height="63" rx="9" fill="#f1f5f9"/><text x="778" y="385" class="tiny">Bukti sebelum / sesudah sesuai tiket</text><rect x="778" y="394" width="105" height="26" rx="5" fill="#bdcddd"/><rect x="895" y="394" width="105" height="26" rx="5" fill="#d5dee8"/>
    <text x="888" y="492" text-anchor="middle" class="label">3 · Timeline dan bukti</text>

    <!-- Poin dan hadiah -->
    <rect x="1078" y="145" width="300" height="325" rx="22" fill="#fff" stroke="#d5deea" stroke-width="3"/>
    <rect x="1086" y="153" width="284" height="60" rx="16" fill="url(#navy)"/><text x="1102" y="178" font-size="12" font-weight="800" class="white">Tukar Poin</text><text x="1102" y="197" font-size="8" class="white">Poin kamu · hadiah tersedia</text>
    <rect x="1100" y="225" width="256" height="62" rx="12" fill="#e6f8f4"/><text x="1115" y="248" class="ui">Saldo poin</text><text x="1115" y="273" font-size="21" font-weight="800" fill="#0a2136">Total poin</text>
    <rect x="1100" y="300" width="122" height="105" rx="12" fill="#f3f6fa"/><circle cx="1161" cy="330" r="17" fill="#15385f"/><text x="1161" y="334" text-anchor="middle" font-size="10" class="white">★</text><text x="1112" y="365" class="tiny">Hadiah</text><rect x="1112" y="375" width="98" height="20" rx="7" fill="#0f9f8c"/><text x="1161" y="389" text-anchor="middle" font-size="7" font-weight="700" class="white">Tukar</text>
    <rect x="1234" y="300" width="122" height="105" rx="12" fill="#f3f6fa"/><circle cx="1295" cy="330" r="17" fill="#15385f"/><text x="1295" y="334" text-anchor="middle" font-size="10" class="white">★</text><text x="1246" y="365" class="tiny">Hadiah lain</text><rect x="1246" y="375" width="98" height="20" rx="7" fill="#dce4ed"/><text x="1295" y="389" text-anchor="middle" font-size="7" font-weight="700" fill="#53677b">Poin kurang</text>
    <text x="1228" y="492" text-anchor="middle" class="label">4 · Poin dan hadiah</text>
  </g>

  <text x="56" y="544" class="section">B. Dinas · dashboard web desktop</text>
  <g filter="url(#shadow)">
    <!-- Dashboard -->
    <rect x="58" y="567" width="300" height="300" rx="16" fill="#fff" stroke="#d5deea" stroke-width="2"/><rect x="58" y="567" width="300" height="27" rx="14" fill="#15385f"/><rect x="58" y="582" width="300" height="12" fill="#15385f"/><text x="72" y="585" font-size="8" font-weight="700" class="white">NadiKota · Dashboard</text>
    <rect x="70" y="608" width="60" height="244" rx="7" fill="#eef3f8"/><text x="79" y="628" class="tiny">Ringkasan</text><text x="79" y="650" class="tiny">Tiket</text><text x="79" y="672" class="tiny">Dispatch</text>
    <text x="145" y="619" class="ui">Ringkasan operasional</text>
    <g><rect x="145" y="630" width="62" height="45" rx="6" fill="#f1f5f9"/><rect x="214" y="630" width="62" height="45" rx="6" fill="#f1f5f9"/><rect x="283" y="630" width="62" height="45" rx="6" fill="#f1f5f9"/><text x="153" y="648" class="tiny">Total</text><text x="153" y="667" class="ui">—</text><text x="222" y="648" class="tiny">Baru</text><text x="222" y="667" class="ui">—</text><text x="291" y="648" class="tiny">Selesai</text><text x="291" y="667" class="ui">—</text></g>
    <rect x="145" y="688" width="200" height="145" rx="7" fill="#f8fafc" stroke="#e2e8f0"/><text x="155" y="706" class="tiny">Laporan dari waktu ke waktu</text><path d="M160 811h170M166 807v-26m23 26v-44m23 44v-35m23 35v-65m23 65v-51m23 51v-77m23 77v-39" stroke="#1d4f7a" stroke-width="7"/>
    <text x="208" y="887" text-anchor="middle" class="label">5 · Dashboard dan metrik</text>

    <!-- Daftar tiket -->
    <rect x="398" y="567" width="300" height="300" rx="16" fill="#fff" stroke="#d5deea" stroke-width="2"/><rect x="398" y="567" width="300" height="27" rx="14" fill="#15385f"/><rect x="398" y="582" width="300" height="12" fill="#15385f"/><text x="412" y="585" font-size="8" font-weight="700" class="white">NadiKota · Tiket</text>
    <rect x="410" y="608" width="60" height="244" rx="7" fill="#eef3f8"/><text x="419" y="628" class="tiny">Dashboard</text><text x="419" y="650" class="tiny">Review</text><text x="419" y="672" class="tiny">Tiket</text>
    <text x="482" y="619" class="ui">Tiket · filter antrean</text><rect x="482" y="630" width="202" height="23" rx="5" fill="#f1f5f9"/><text x="491" y="645" class="tiny">Cari · status · prioritas</text>
    <g><rect x="482" y="661" width="202" height="38" rx="5" fill="#fff" stroke="#e2e8f0"/><rect x="482" y="704" width="202" height="38" rx="5" fill="#fff" stroke="#e2e8f0"/><rect x="482" y="747" width="202" height="38" rx="5" fill="#fff" stroke="#e2e8f0"/><rect x="482" y="790" width="202" height="38" rx="5" fill="#fff" stroke="#e2e8f0"/><text x="491" y="678" class="tiny">Tiket · jalan berlubang</text><text x="491" y="691" font-size="7" fill="#b45309">queued · prioritas</text><text x="491" y="721" class="tiny">Tiket · PJU padam</text><text x="491" y="734" font-size="7" fill="#b45309">in_progress</text><text x="491" y="764" class="tiny">Tiket · jalan rusak</text><text x="491" y="777" font-size="7" fill="#60748a">needs_review</text><text x="491" y="807" class="tiny">Daftar tiket dengan filter</text></g>
    <text x="548" y="887" text-anchor="middle" class="label">6 · Daftar tiket / antrean via filter</text>

    <!-- Review -->
    <rect x="738" y="567" width="300" height="300" rx="16" fill="#fff" stroke="#d5deea" stroke-width="2"/><rect x="738" y="567" width="300" height="27" rx="14" fill="#15385f"/><rect x="738" y="582" width="300" height="12" fill="#15385f"/><text x="752" y="585" font-size="8" font-weight="700" class="white">NadiKota · Review tiket</text>
    <text x="756" y="619" class="ui">Tiket · kategori dan status</text><rect x="756" y="629" width="264" height="72" rx="7" fill="#f1f5f9"/><rect x="765" y="638" width="74" height="54" rx="5" fill="#94a3b8"/><text x="851" y="646" class="tiny">Lokasi dan kategori</text><text x="851" y="663" class="tiny">Status: needs_review</text><text x="851" y="680" class="tiny">Bahaya ditinjau admin</text>
    <rect x="756" y="712" width="264" height="48" rx="7" fill="#e6f8f4"/><text x="768" y="732" class="tiny">Review manusia: setujui atau tolak</text><text x="768" y="749" class="tiny">PriorityBreakdown belum terpasang aktif</text>
    <rect x="756" y="772" width="122" height="29" rx="7" fill="#0f9f8c"/><text x="817" y="790" text-anchor="middle" font-size="8" font-weight="700" class="white">Setujui</text><rect x="889" y="772" width="131" height="29" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="954" y="790" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">Tolak + alasan</text>
    <text x="888" y="887" text-anchor="middle" class="label">7 · Review dan keputusan</text>

    <!-- Dispatch -->
    <rect x="1078" y="567" width="300" height="300" rx="16" fill="#fff" stroke="#d5deea" stroke-width="2"/><rect x="1078" y="567" width="300" height="27" rx="14" fill="#15385f"/><rect x="1078" y="582" width="300" height="12" fill="#15385f"/><text x="1092" y="585" font-size="8" font-weight="700" class="white">NadiKota · Dispatch</text>
    <text x="1096" y="619" class="ui">Tugaskan tiket</text><text x="1096" y="642" class="tiny">Pilih tim lapangan</text><rect x="1096" y="651" width="264" height="33" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1107" y="672" class="tiny">Pilih tim</text><text x="1096" y="707" class="tiny">Ringkasan tiket dan SLA</text><rect x="1096" y="716" width="264" height="57" rx="7" fill="#f1f5f9"/><text x="1108" y="737" class="tiny">Tiket queued · info tenggat</text><text x="1108" y="755" class="tiny">Tim mulai kerja setelah dispatch</text>
    <rect x="1096" y="786" width="158" height="30" rx="7" fill="url(#orange)"/><text x="1175" y="805" text-anchor="middle" font-size="8" font-weight="700" class="white">Tugaskan tim</text><rect x="1262" y="786" width="98" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1311" y="805" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">Batal</text>
    <text x="1228" y="887" text-anchor="middle" class="label">8 · Dispatch tim lapangan</text>
  </g>

  <rect x="58" y="920" width="1320" height="48" rx="13" fill="#fff7ed" stroke="#f2d3a9"/>
  <text x="78" y="941" font-size="11" font-weight="700" fill="#93500b">Catatan akurasi:</text>
  <text x="184" y="941" class="note">Kamera/lokasi bagian dari form bertahap. Duplikat ditangani backend clustering; UI konfirmasi duplikat terpisah tidak ditemukan.</text>
  <text x="78" y="959" class="note">Antrean memakai filter daftar tiket. Komponen PriorityBreakdown ada, tetapi tidak ditemukan penggunaan aktif.</text>
</svg>
